<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌宠气泡</title>
  <link rel="stylesheet" href="/src/renderer/ui/theme.css">
  <style>
    html {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      box-sizing: border-box;
      /* 气泡靠近屏幕边缘时不要被裁掉：给影子与小尾巴留出余量。
         这一圈留白**只加在 body 上**：html 与 body 都加的话，
         留白就是两圈，而窗口是按内容尺寸开出来的——
         多出来的那一圈会把气泡挤到窗口边上，小尾巴与影子就被切掉。 */
      padding: 16px;
    }
    /* 宽度按内容走：窗口是主进程按内容尺寸摆出来的，
       这里若被窗口宽度限制住，量出来的尺寸就是错的。

       用 block 而不是 inline-block：行盒的高度是按基线与行撑算出来的，
       用 block 就是气泡本身的高度——窗口是按内容尺寸开的，
       这个差别会变成留白里少掉的几像素。 */
    #bubble {
      display: block;
      width: max-content;
      max-width: 340px;
      box-sizing: border-box;
      position: relative;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--dp-bg);
      border: 1px solid var(--dp-border);
      /* 影子的模糊半径要小于留白：放不下就会被窗口边削掉半截。 */
      box-shadow: 0 4px 10px var(--dp-shadow-strong);
      font: var(--dp-font);
      line-height: 1.65;
      color: var(--dp-text);
      -webkit-user-select: text;
      user-select: text;
      /* 弹入：小缩放 + 上移，像从桌宠那儿「冒」出来。 */
      animation: bubble-in 0.18s ease-out;
    }
    @keyframes bubble-in {
      from { opacity: 0; transform: scale(0.92) translateY(4px); }
    }
    #bubble.hidden { display: none; }

    /* 指向桌宠的小尾巴 */
    #tail {
      position: absolute;
      width: 14px; height: 14px;
      background: var(--dp-bg);
      border-right: 1px solid var(--dp-border);
      border-bottom: 1px solid var(--dp-border);
      transform: rotate(45deg);
    }
    #bubble[data-placement="top"] #tail {
      bottom: -8px; left: 50%; margin-left: -7px;
      border-top: none; border-left: none;
    }
    #bubble[data-placement="bottom"] #tail {
      top: -8px; left: 50%; margin-left: -7px;
      border-bottom: none; border-right: none;
    }
    #bubble[data-placement="left"] #tail {
      right: -8px; top: 50%; margin-top: -7px;
      border-bottom: none; border-left: none;
    }
    #bubble[data-placement="right"] #tail {
      left: -8px; top: 50%; margin-top: -7px;
      border-top: none; border-right: none;
    }

    #title {
      font-weight: 600;
      font-size: 13px;
      color: var(--dp-text-soft);
      margin-bottom: 4px;
    }
    #title:empty { display: none; }
    #text { white-space: pre-wrap; word-break: break-word; }
    #text:empty { display: none; }

    /* 卡片的按钮行：审批是四个按钮并排，选择是一个一个竖着排。 */
    #actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    #actions:empty { display: none; }
    #actions button {
      font: inherit;
      font-size: 13px;
      line-height: 1;
      color: var(--dp-text);
      background: var(--dp-surface-2);
      border: 1px solid var(--dp-border);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
    }
    #actions button:hover { background: var(--dp-surface-hover); }
    #actions button[data-decision="allow"] { color: var(--dp-ok); }
    #actions button[data-decision="deny"] { color: var(--dp-danger); }
    #actions button[data-decision="cancel"] { color: var(--dp-text-soft); }

    /* 选择卡：选项是一句话，竖着排才读得完。 */
    #bubble[data-kind="choice"] #actions {
      flex-direction: column;
      align-items: stretch;
    }
    #bubble[data-kind="choice"] #actions button {
      text-align: left;
      line-height: 1.5;
      padding: 8px 12px;
    }

    /* 流式回复：末尾跟一个闪烁的光标，让用户知道「还在写」。 */
    #bubble.streaming #text::after {
      content: '▍';
      color: var(--dp-text-faint);
      animation: bubble-blink 1s steps(2, start) infinite;
    }
    @keyframes bubble-blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="bubble" data-placement="top">
    <div id="title"></div>
    <div id="text"></div>
    <div id="actions"></div>
    <div id="tail"></div>
  </div>

  <script type="module" src="/src/renderer/bubble/main.js"></script>
</body>
</html>
