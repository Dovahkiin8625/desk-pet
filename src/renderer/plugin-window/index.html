<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌宠插件窗口</title>
  <link rel="stylesheet" href="/src/renderer/ui/theme.css">
  <link rel="stylesheet" href="/src/renderer/ui/blocks.css">
  <style>
    /* 颜色走 theme.css 的变量（上面链着那份）：
       改主题只改一处，这一页跟着变。 */
    :root { color-scheme: light; }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      height: 100%;
      font: var(--dp-font);
      color: var(--dp-text);
    }
    #win {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--dp-bg);
      border: 1px solid #d8d2c4;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(40, 34, 24, 0.22);
      overflow: hidden;
    }
    /* 小部件：透明、无边框——它是**画在桌面上的**，不是一个窗口。 */
    #win[data-mode="widget"] {
      background: rgba(255, 253, 248, 0.92);
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(40, 34, 24, 0.18);
    }

    #head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 12px;
      border-bottom: 1px solid var(--dp-border-soft);
      /* 标题栏可以拖：整个窗口跟着走。 */
      -webkit-app-region: drag;
      flex: none;
    }
    #win[data-mode="widget"] #head { padding: 6px 6px 6px 10px; }
    #title { font-weight: 600; }
    #win[data-mode="widget"] #title { font-size: 12px; }
    #head .spacer { flex: 1; }
    #head button {
      -webkit-app-region: no-drag;
      font: inherit;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--dp-text-soft);
      cursor: pointer;
      font-size: 14px;
    }
    #head button:hover { background: #f1ead8; color: #3a352c; }
    #head button[hidden] { display: none; }
    /* 置顶开着时高亮：一眼看得出它压着别人。 */
    #head button.on { background: #efe4c6; color: #7a6a4f; }

    #subtitle {
      padding: 6px 14px 0;
      color: var(--dp-text-soft);
      font-size: 12px;
      flex: none;
    }
    #subtitle:empty { display: none; }
    #body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px 12px;
    }
    #status {
      padding: 7px 14px;
      border-top: 1px solid var(--dp-border-soft);
      color: #7a6a4f;
      font-size: 12px;
      min-height: 30px;
      flex: none;
    }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="win" data-mode="window">
    <header id="head">
      <span id="title"></span>
      <span class="spacer"></span>
      <button id="pin" title="置顶">📌</button>
      <button id="mode" title="变成桌面小部件">▣</button>
      <button id="close" title="关闭">✕</button>
    </header>
    <div id="subtitle"></div>
    <div id="body"></div>
    <div id="status"></div>
  </div>

  <script type="module" src="/src/renderer/plugin-window/main.js"></script>
</body>
</html>
