<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌宠插件面板</title>
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      /* 阴影留白：窗口是透明的，卡片画在中间。 */
      padding: 6px;
      box-sizing: border-box;
      /* 高度链要通：#panel 的 height: 100% 才有参照。 */
      height: 100%;
    }
    #panel {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fffdf8;
      border: 1px solid #d8d2c4;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(40, 34, 24, 0.3);
      font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #2b2a26;
      overflow: hidden;
    }
    /* 插件视图：卡片按内容收缩，窗口跟着变矮。
       （不收缩的话，窗口下半截是**透明**的——那部分仍会吃掉桌面的点击。）

       这里**不能**写 max-height: 100%——那会让卡片的高度取决于窗口的高度，
       而窗口的高度又取决于卡片的高度：两头互相等着，内容区会被越挤越小。 */
    #panel[data-view="plugin"] { height: auto; }
    #panel section { display: flex; flex-direction: column; min-height: 0; height: 100%; }
    #panel section[hidden] { display: none; }

    /* —— 搜索视图 —— */
    #searchbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #ece6d8;
      -webkit-app-region: drag;
    }
    #searchbar .icon { font-size: 15px; opacity: 0.65; }
    #query {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      font: 16px/1.4 inherit;
      -webkit-app-region: no-drag;
    }
    #query::placeholder { color: #a9a294; }

    #results-wrap {
      /* flex-basis 用 auto（不是 0）：基准尺寸就是内容的高度，
         内容装得下时不会被压扁（压扁了就会冒出多余的滚动条）。 */
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    #results {
      list-style: none;
      margin: 0;
      padding: 6px;
    }
    #results li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    #results li.active { background: #f1ead8; }
    #results li:hover { background: #f6f1e4; }
    #results .icon { width: 20px; text-align: center; font-size: 15px; }
    #results .name { font-weight: 600; }
    #results .name mark { background: #f0dfa8; color: inherit; border-radius: 3px; padding: 0 1px; }
    #results .desc {
      margin-left: auto;
      color: #8a8272;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    #empty {
      padding: 24px 16px;
      text-align: center;
      color: #9a9384;
    }
    #empty[hidden] { display: none; }
    /* 搜索视图底部那行提示（启动结果）。 */
    #search-status {
      padding: 7px 14px;
      border-top: 1px solid #ece6d8;
      color: #7a6a4f;
      font-size: 12px;
      min-height: 30px;
    }
    #search-status[hidden] { display: none; }

    /* —— 插件视图 —— */
    #plugin-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 12px;
      border-bottom: 1px solid #ece6d8;
      -webkit-app-region: drag;
    }
    #plugin-title { font-weight: 600; }
    #plugin-subtitle {
      padding: 6px 14px 0;
      color: #8a8272;
      font-size: 12px;
    }
    #plugin-subtitle:empty { display: none; }
    #plugin-head .spacer { flex: 1; }
    #plugin-head button {
      -webkit-app-region: no-drag;
      font: inherit;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #8a8272;
      cursor: pointer;
      font-size: 14px;
    }
    #plugin-head button:hover { background: #f1ead8; color: #3a352c; }
    #plugin-body {
      /* 高度由内容决定（上限写死在下面），**不**跟着窗口长。
         跟着窗口长就会变成「窗口等卡片、卡片等窗口」的死循环。 */
      flex: 0 1 auto;
      min-height: 0;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px 14px 12px;
    }
    #plugin-status {
      padding: 7px 14px;
      border-top: 1px solid #ece6d8;
      color: #7a6a4f;
      font-size: 12px;
      min-height: 30px;
    }
    #plugin-status:empty { display: none; }

    /* —— 插件页面里的块 —— */
    .block-text { white-space: pre-wrap; word-break: break-word; }
    .block-empty { color: #9a9384; padding: 10px 0; }
    .block-list { list-style: none; margin: 0 0 10px; padding: 0; }
    .block-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .block-list li:hover { background: #f6f1e4; }
    .block-list li.done .label { color: #9a9384; text-decoration: line-through; }
    .block-list .label { flex: 1; word-break: break-word; }
    .block-list .hint { color: #a29a89; font-size: 12px; white-space: nowrap; }
    .block-list .remove {
      border: none;
      background: transparent;
      color: #b3ab99;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 6px;
    }
    .block-list .remove:hover { background: #efe6d2; color: #8a6a4a; }
    .block-input { display: flex; gap: 8px; margin-bottom: 10px; }
    .block-input input {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 7px 10px;
      border: 1px solid #c9c1b0;
      border-radius: 9px;
      background: #fff;
      color: inherit;
    }
    .block-input input:focus { outline: 2px solid #c8b78f; outline-offset: 1px; }
    .block-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .block-buttons button {
      font: inherit;
      padding: 6px 13px;
      border: 1px solid #c9c1b0;
      border-radius: 9px;
      background: #f6f2e7;
      color: #3a352c;
      cursor: pointer;
    }
    .block-buttons button:hover { background: #efe9d8; }
    .block-buttons button.primary { background: #d9c9a3; border-color: #bda87c; }
    .block-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
    }
    .block-toggle input { accent-color: #bda87c; }

    /* 聊天记录：带角色与时间，条条都不可点。 */
    .block-messages { list-style: none; margin: 0 0 10px; padding: 0; }
    .block-messages li {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .block-messages li.user { background: #ece6d8; }
    .block-messages li.assistant { background: #f6f2e7; }
    .block-messages .role { font-size: 12px; color: #8a8272; flex: none; }
    .block-messages .text { flex: 1; word-break: break-word; }
    .block-messages .time { font-size: 11px; color: #a9a294; flex: none; }
  </style>
</head>
<body>
  <div id="panel" data-view="search">
    <section id="search">
      <div id="searchbar">
        <span class="icon">🔍</span>
        <input id="query" type="text" placeholder="搜索插件或程序…" autocomplete="off" spellcheck="false" />
      </div>
      <div id="results-wrap">
        <ul id="results"></ul>
        <div id="empty" hidden>没有匹配的结果</div>
      </div>
      <div id="search-status" hidden></div>
    </section>

    <section id="plugin" hidden>
      <header id="plugin-head">
        <button id="back" title="返回搜索">←</button>
        <span id="plugin-title"></span>
        <span class="spacer"></span>
        <button id="close" title="关闭">✕</button>
      </header>
      <div id="plugin-subtitle"></div>
      <div id="plugin-body"></div>
      <div id="plugin-status"></div>
    </section>
  </div>

  <script type="module" src="/src/renderer/panel/main.js"></script>
</body>
</html>
