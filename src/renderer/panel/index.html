<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌宠插件面板</title>
  <link rel="stylesheet" href="/src/renderer/ui/theme.css">
  <link rel="stylesheet" href="/src/renderer/ui/blocks.css">
  <style>
    /* 颜色走 theme.css 的变量（上面链着那份）：
       改主题只改一处，这一页跟着变。 */
    :root { color-scheme: light; }
    html {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      /* 高度链要通：#panel 的 height: 100% 才有参照。 */
      height: 100%;
    }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      box-sizing: border-box;
      height: 100%;
      /* 阴影留白：窗口是透明的，卡片画在中间。
         留白必须**放得下阴影**：上下左右各留的那一圈
         要大于阴影的扩散半径，否则阴影会被窗口边界切掉
         （底部那一截被切掉最明显，像卡片没画完）。

         这一圈留白**只加在 body 上**：
         html 与 body 都加的话，卡片会被推进两圈留白里，
         而窗口高度是按一圈算的（reportHeight 只量 body 的留白）——
         卡片下沿会顶出 body 的裁剪框，圆角被切平，影子也被切掉半截。 */
      padding: 12px 12px 16px;
    }
    #panel {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--dp-bg);
      border: 1px solid #d8d2c4;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(40, 34, 24, 0.28);
      font: var(--dp-font);
      color: var(--dp-text);
      overflow: hidden;
    }
    /* 插件视图：卡片按内容收缩，窗口跟着变矮。
       （不收缩的话，窗口下半截是**透明**的——那部分仍会吃掉桌面的点击。）

       这里**不能**写 max-height: 100%——那会让卡片的高度取决于窗口的高度，
       而窗口的高度又取决于卡片的高度：两头互相等着，内容区会被越挤越小。 */
    #panel[data-view="plugin"] { height: auto; }
    #panel section { display: flex; flex-direction: column; min-height: 0; height: 100%; }
    #panel section[hidden] { display: none; }

    /* —— 搜索视图 —— */
    #searchbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--dp-border-soft);
      -webkit-app-region: drag;
    }
    /* 图标不再只是「搜索」：这个框既搜插件与程序，也能直接跟桌宠说话。
       放大镜会把它说窄了，用一颗星星表示「万能输入」。 */
    #searchbar .icon { font-size: 15px; opacity: 0.85; }
    #query {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      font: 16px/1.4 inherit;
      -webkit-app-region: no-drag;
    }
    #query::placeholder { color: var(--dp-text-faint); }

    #results-wrap {
      /* flex-basis 用 auto（不是 0）：基准尺寸就是内容的高度，
         内容装得下时不会被压扁（压扁了就会冒出多余的滚动条）。 */
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    #results {
      list-style: none;
      margin: 0;
      padding: 6px;
    }
    #results li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    #results li.active { background: #f1ead8; }
    #results li:hover { background: var(--dp-surface); }
    #results .icon { width: 20px; text-align: center; font-size: 15px; }
    #results .name { font-weight: 600; }
    #results .name mark { background: #f0dfa8; color: inherit; border-radius: 3px; padding: 0 1px; }
    #results .desc {
      margin-left: auto;
      color: var(--dp-text-soft);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    #empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--dp-text-faint);
    }
    #empty[hidden] { display: none; }
    /* 搜索视图底部那行提示（启动结果）。 */
    #search-status {
      padding: 7px 14px;
      border-top: 1px solid var(--dp-border-soft);
      color: #7a6a4f;
      font-size: 12px;
      min-height: 30px;
    }
    #search-status[hidden] { display: none; }

    /* —— 插件视图 —— */
    #plugin-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 12px;
      border-bottom: 1px solid var(--dp-border-soft);
      -webkit-app-region: drag;
    }
    #plugin-title { font-weight: 600; }
    #plugin-subtitle {
      padding: 6px 14px 0;
      color: var(--dp-text-soft);
      font-size: 12px;
    }
    #plugin-subtitle:empty { display: none; }
    #plugin-head .spacer { flex: 1; }
    #plugin-head button {
      -webkit-app-region: no-drag;
      font: inherit;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--dp-text-soft);
      cursor: pointer;
      font-size: 14px;
    }
    #plugin-head button:hover { background: #f1ead8; color: #3a352c; }
    /* 这个插件不支持的形态：按钮整个藏掉，不留一个点不动的灰按钮。 */
    #plugin-head button[hidden] { display: none; }
    #plugin-body {
      /* 高度由内容决定（上限写死在下面），**不**跟着窗口长。
         跟着窗口长就会变成「窗口等卡片、卡片等窗口」的死循环。 */
      flex: 0 1 auto;
      min-height: 0;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px 14px 12px;
    }
    #plugin-status {
      padding: 7px 14px;
      border-top: 1px solid var(--dp-border-soft);
      color: #7a6a4f;
      font-size: 12px;
      min-height: 30px;
    }
    #plugin-status:empty { display: none; }

    /* 插件自带页面时，积木区让位给 iframe。 */
    #plugin-frame {
      width: 100%;
      border: none;
      background: transparent;
      display: block;
      /* **不缩**：高度由 main.js 按「窗口装得下的高度」设死，
         让它能缩的话，卡片会被挤小、页面看着少一截。

         也**不设 max-height**：上限是「窗口实际有多高」，
         那要算出来才知道（要减掉标题栏、状态栏、留白），
         写死一个数只会和窗口对不上——对不上就意味着
         多出来的那一截被裁掉了（底部的按钮点不到）。 */
      flex: none;
      min-height: 0;
    }
    #plugin-frame[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="panel" data-view="search">
    <section id="search">
      <div id="searchbar">
        <span class="icon">✨</span>
        <input id="query" type="text" placeholder="搜索插件、程序，或跟桌宠说点什么…" autocomplete="off" spellcheck="false" />
      </div>
      <div id="results-wrap">
        <ul id="results"></ul>
        <div id="empty" hidden>没有匹配的结果</div>
      </div>
      <div id="search-status" hidden></div>
    </section>

    <section id="plugin" hidden>
      <header id="plugin-head">
        <button id="back" title="返回搜索">←</button>
        <span id="plugin-title"></span>
        <span class="spacer"></span>
        <button id="detach" title="在新窗口打开" hidden>↗</button>
        <button id="widget" title="变成桌面小部件" hidden>▣</button>
        <button id="close" title="关闭">✕</button>
      </header>
      <div id="plugin-subtitle"></div>
      <div id="plugin-body"></div>
      <!-- 插件自带的页面装在这里（src 由插件清单里的 page 决定）。 -->
      <iframe id="plugin-frame" hidden></iframe>
      <div id="plugin-status"></div>
    </section>
  </div>

  <script type="module" src="/src/renderer/panel/main.js"></script>
</body>
</html>
