<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>剪贴板</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body class="dp-page">
    <div class="clip">
      <!-- 顶栏：搜索 + 记录开关 + 清空 -->
      <header class="bar">
        <input
          id="search"
          class="dp-input search"
          type="search"
          placeholder="搜索历史…"
          autocomplete="off"
          spellcheck="false"
        />
        <label class="dp-switch record" title="复制什么就记什么（内容会存在本机）">
          <input id="record" type="checkbox" />
          <span>记录</span>
        </label>
        <button type="button" class="dp-button small" id="clearBtn">清空</button>
      </header>

      <!-- 列表：固定的在上，其余按时间倒序 -->
      <div class="list-wrap" id="listWrap">
        <ul class="dp-list clip-list" id="list"></ul>
        <p class="empty" id="empty" hidden>还没有复制过东西</p>
      </div>

      <footer class="dp-footer">
        <span class="grow" id="statusText">双击一条就贴出去</span>
        <button type="button" class="gear" id="gearBtn" title="设置" aria-label="设置">⚙</button>
      </footer>

      <!-- 设置抽屉 -->
      <div class="scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" hidden aria-label="设置">
        <div class="drawer-head">
          <h2>设置</h2>
          <button type="button" class="drawer-close" id="drawerClose" title="关上">✕</button>
        </div>
        <div class="drawer-body">
          <section class="set-group">
            <h3 class="dp-section-title">助手</h3>
            <label class="field">
              <span>复制时提示一句</span>
              <input id="assistant" type="checkbox" />
            </label>
            <p class="set-hint">
              桌宠在气泡里说一句「你复制了…」。关掉它，桌宠就不吭声了——
              历史照样在记。
            </p>
          </section>

          <section class="set-group">
            <h3 class="dp-section-title">历史</h3>
            <label class="field">
              <span>最多留几条</span>
              <input id="maxEntries" class="dp-input" type="number" min="1" max="2000" />
            </label>
            <p class="set-hint">
              历史存在本机的 <code>clipboard-history.json</code> 里，退出后仍然保留。
              关掉顶栏的「记录」就不再往里存了。
            </p>
          </section>

          <section class="set-group">
            <h3 class="dp-section-title">快捷键</h3>
            <p class="set-hint">点「改」再按键（要带 Ctrl / Alt / Shift）。</p>
            <div class="hk-row">
              <span class="hk-name">打开历史</span>
              <kbd class="hk-key" id="showKey"></kbd>
              <button type="button" class="dp-button small" id="showKeyBtn">改</button>
            </div>
            <div class="hk-row">
              <span class="hk-name">粘贴最近一条</span>
              <kbd class="hk-key" id="pasteKey"></kbd>
              <button type="button" class="dp-button small" id="pasteKeyBtn">改</button>
            </div>
            <p class="note" id="hotkeyError" hidden></p>
          </section>
        </div>
      </aside>
    </div>

    <script type="module" src="history.js"></script>
  </body>
</html>
