<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>翻译</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <link rel="stylesheet" href="translate.css" />
  </head>
  <body class="dp-page">
    <div class="tr">
      <section class="box">
        <div class="box-head">
          <span class="label">原文</span>
          <span class="hint" id="sourceHint"></span>
        </div>
        <textarea
          id="source"
          class="dp-input area"
          placeholder="要翻译的文字…"
          spellcheck="false"
        ></textarea>
        <div class="row">
          <button type="button" class="dp-button primary" id="translateBtn">翻译</button>
          <span class="spacer"></span>
          <span class="hint" id="targetHint"></span>
        </div>
      </section>

      <section class="box">
        <div class="box-head">
          <span class="label">译文</span>
          <span class="hint" id="engineHint"></span>
        </div>
        <textarea
          id="result"
          class="dp-input area copyable"
          placeholder="译文在这儿…"
          title="点一下复制译文"
          readonly
        ></textarea>
        <div class="vars" id="varsBox" hidden>
          <div class="vars-head">
            <span class="label">变量名</span>
            <span class="hint">点一下复制</span>
          </div>
          <div class="vars-row">
            <button type="button" class="var-item" id="varLower" title="点一下复制">
              <code id="varLowerText"></code>
              <span class="var-kind">小驼峰</span>
            </button>
            <button type="button" class="var-item" id="varUpper" title="点一下复制">
              <code id="varUpperText"></code>
              <span class="var-kind">大驼峰</span>
            </button>
          </div>
        </div>
      </section>

      <footer class="dp-footer">
        <span class="grow" id="statusText"></span>
        <button type="button" class="gear" id="gearBtn" title="设置" aria-label="设置">
          <span class="icon" data-icon="settings"></span>
        </button>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module" src="translate.js"></script>
  </body>
</html>
