<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>聊天记录</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <style>
      body {
        margin: 0;
        /* 独立窗口里按视口铺满；面板里按内容撑开（见 pluginPage.js 的说明）。 */
        min-height: 100vh;
        font: var(--dp-font);
        color: var(--dp-text);
        background: var(--dp-bg);
      }
      body.dp-panel {
        min-height: 0;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        gap: var(--dp-gap);
        padding: 12px;
      }
      #head {
        display: flex;
        align-items: baseline;
        gap: var(--dp-gap);
      }
      #head h1 {
        margin: 0;
        font-size: 15px;
      }
      #count {
        color: var(--dp-text-soft);
        font-size: 12px;
      }
      #head .grow {
        flex: 1;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* 分组：今天 / 昨天 / 更早按月。 */
      .day {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .day-title {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--dp-text-soft);
      }
      .day-count {
        color: var(--dp-text-faint);
        font-weight: 400;
      }
      /* 块：一次发话。 */
      .turn {
        border: 1px solid var(--dp-border-soft);
        border-radius: var(--dp-radius);
        background: var(--dp-surface);
        padding: 8px 10px;
      }
      .turn summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .turn summary::-webkit-details-marker {
        display: none;
      }
      .turn-time {
        flex: none;
        font-size: 12px;
        color: var(--dp-text-faint);
      }
      /* 标题：只占一行，长的截断。 */
      .turn-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      /* 徽标：已答 / 后台运行中 / 已完成 / 失败。 */
      .turn-badge {
        flex: none;
        padding: 1px 7px;
        border-radius: var(--dp-radius-sm);
        font-size: 11px;
        color: var(--dp-text-soft);
        background: var(--dp-bg);
        border: 1px solid var(--dp-border-soft);
      }
      .turn-badge.badge-running {
        color: var(--dp-accent-strong);
        border-color: var(--dp-accent-strong);
      }
      .turn-badge.badge-failed {
        color: var(--dp-danger);
        border-color: var(--dp-danger);
      }
      /* 块上的两个说明：没有对应的那句话 / 桌宠自己起的头。 */
      .turn-flag {
        flex: none;
        font-size: 11px;
        color: var(--dp-text-faint);
      }
      .turn-body {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* 段：桌宠这边 / 后台那边。 */
      .lane {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lane-title {
        margin: 0;
        font-size: 12px;
        color: var(--dp-text-soft);
      }
      /* 明细：默认折起。 */
      .detail {
        border-left: 2px solid var(--dp-border-soft);
        padding-left: 8px;
      }
      .detail-head {
        cursor: pointer;
        list-style: none;
        font-size: 12px;
        color: var(--dp-text-soft);
      }
      .detail-head::-webkit-details-marker {
        display: none;
      }
      .detail-body {
        margin-top: 4px;
      }
      .detail-pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        font-family: inherit;
        color: var(--dp-text-soft);
      }
      .model-line,
      .reply-line,
      .line-task,
      .line-approval {
        margin: 0;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .reply-line {
        color: var(--dp-text);
      }
      .line-task,
      .line-approval {
        color: var(--dp-text-soft);
      }
      /* 后台那边的一个任务。 */
      .task {
        border: 1px solid var(--dp-border-soft);
        border-radius: var(--dp-radius);
        background: var(--dp-bg);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .task-title {
        font-weight: 600;
        font-size: 12px;
      }
      .task-status {
        color: var(--dp-text-soft);
        font-size: 12px;
      }
      .task-result {
        font-size: 12px;
      }
      .step-list {
        margin: 4px 0 0;
        padding-left: 18px;
        font-size: 12px;
        color: var(--dp-text-soft);
      }
      #empty {
        color: var(--dp-text-faint);
        text-align: center;
        padding: 24px 0;
      }
      /* 宽版（独立窗口）：组里的对话块分两列，组标题跨两列。 */
      @media (min-width: 560px) {
        #list {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px 16px;
          align-items: start;
        }
        .day {
          display: contents;
        }
        .day-title {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="head">
        <h1>聊天记录</h1>
        <span id="count"></span>
        <span class="grow"></span>
        <button id="clear" class="dp-button" type="button">清空</button>
      </div>
      <div id="list"></div>
      <div id="empty">还没和桌宠聊过天</div>
    </div>
    <script type="module" src="history.js"></script>
  </body>
</html>
