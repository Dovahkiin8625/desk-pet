<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>系统监控</title>
  <link rel="stylesheet" href="/src/renderer/ui/widget.css" />
  <style>
    :root { color-scheme: light; }
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      height: 100%;
      font: 12px/1.4 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #2b2a26;
    }
    .row { display: flex; align-items: center; gap: 6px; }
    .row .name { width: 26px; color: #8a8272; flex: none; }
    .bar {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #ece6d8;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 3px;
      background: #c9b98c;
      transition: width 0.4s ease;
    }
    .bar.hot i { background: #d08a6a; }
    .row .val { width: 34px; text-align: right; color: #6d6558; flex: none; font-variant-numeric: tabular-nums; }
    #foot {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8a8272;
      font-size: 11px;
    }
    #foot .spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="card" class="dp-widget-card">
    <div id="head" class="dp-widget-head">
      <span>系统监控</span>
      <span class="spacer"></span>
      <button id="expand" title="变回独立窗口">▣</button>
      <button id="close" title="收起来">✕</button>
    </div>
    <div class="row">
      <span class="name">CPU</span>
      <span class="bar"><i id="cpu-bar"></i></span>
      <span class="val" id="cpu-val">—</span>
    </div>
    <div class="row">
      <span class="name">内存</span>
      <span class="bar"><i id="mem-bar"></i></span>
      <span class="val" id="mem-val">—</span>
    </div>
    <div class="row">
      <span class="name">GPU</span>
      <span class="bar"><i id="gpu-bar"></i></span>
      <span class="val" id="gpu-val">—</span>
    </div>
    <div id="foot">
      <span id="thermal">温度 —</span>
      <span class="spacer"></span>
      <span id="vram"></span>
      <span id="power"></span>
    </div>
  </div>

  <script type="module" src="/plugins/system/widget.js"></script>
</body>
</html>
