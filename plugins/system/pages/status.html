<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>系统状态</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <style>
      /*
       * 系统状态的面板与独立窗口。
       *
       * 与天气面板同一套语言：图标 tile + 大字数值 + 细进度条，
       * 用得狠了整卡染红。颜色、控件全部走 theme.css 的变量，
       * 这里只管排版。
       */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body.dp-page {
        background: var(--dp-bg);
      }
      body.dp-panel {
        height: 100%;
        overflow: hidden;
      }
      body.dp-panel .status {
        height: 100%;
      }
      .status {
        display: flex;
        flex-direction: column;
        min-height: 0;
        box-sizing: border-box;
      }
      /* 独立窗口：铺满整个视口（高度是用户拖出来的）。 */
      body:not(.dp-panel) .status {
        height: 100vh;
      }

      /* ---------------- 过热横幅 ---------------- */
      .banner {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 12px 0;
        padding: 10px 14px;
        border-radius: var(--dp-radius);
        border: 1px solid var(--dp-danger-border);
        background: var(--dp-danger-bg);
        color: var(--dp-danger);
        font-size: 13px;
        font-weight: 600;
      }
      .banner[hidden] { display: none; }
      .banner .dp-icon { font-size: 17px; flex: none; }

      /* ---------------- 三条用量 ---------------- */
      .meters {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
        align-content: start;
      }
      /* 独立窗口里内容少，让它整体居中；面板里贴着上面。 */
      body:not(.dp-panel) .meters {
        align-content: center;
      }
      @media (max-width: 480px) {
        .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 14px 13px;
        border: 1px solid var(--dp-border-soft);
        border-radius: var(--dp-radius-lg);
        background: var(--dp-surface);
      }
      .stat-head { display: flex; align-items: center; gap: 7px; }
      .stat-icon {
        width: 24px; height: 24px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        background: var(--dp-accent-soft); color: var(--dp-accent-ink);
      }
      .stat-icon .dp-icon { width: 14px; height: 14px; }
      .card.hot .stat-icon { background: var(--dp-danger); color: #fff; }
      .stat-label { font-size: 12px; color: var(--dp-text-soft); }
      .stat-value {
        font-size: 22px; font-weight: 600; line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      .card.hot .stat-value { color: var(--dp-danger); }
      .stat-note {
        font-size: 11px; color: var(--dp-text-faint);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        min-height: 13px;
      }
      .track {
        height: 6px;
        border-radius: 999px;
        background: var(--dp-surface-sunken);
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--dp-accent-strong);
        transition: width 0.4s ease;
        position: relative;
        overflow: hidden;
      }
      /* 缓慢走过的一道高光：条子是「活的」。 */
      .track i::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.45) 50%, transparent 80%);
        transform: translateX(-100%);
        animation: stat-shine 2.8s ease-in-out infinite;
      }
      @keyframes stat-shine { 60%, 100% { transform: translateX(100%); } }
      .card.hot .track i { background: var(--dp-danger); }

      /* ---------------- 底下那行字里的三件小事 ---------------- */
      .info-row {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 0 12px 10px;
      }
      .info-tile {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--dp-border-soft);
        border-radius: var(--dp-radius);
        background: var(--dp-surface);
      }
      .info-tile .stat-icon { width: 22px; height: 22px; }
      .info-tile .stat-icon .dp-icon { width: 13px; height: 13px; }
      .info-tile .info-meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .info-tile .info-label { font-size: 11px; color: var(--dp-text-faint); }
      .info-tile .info-text {
        font-size: 12px; font-weight: 600; color: var(--dp-text-soft);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* 温度到 serious 以上：整格染红。 */
      .info-tile.hot { border-color: var(--dp-danger-border); background: var(--dp-danger-bg); }
      .info-tile.hot .stat-icon { background: var(--dp-danger); color: #fff; }
      .info-tile.hot .info-text { color: var(--dp-danger); }

      /* ---------------- 底下那行 ---------------- */
      .gear {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--dp-text-soft);
        cursor: pointer;
        font-size: 15px;
      }
      .gear:hover {
        background: var(--dp-surface-hover);
      }
      .gear[hidden] {
        display: none;
      }
    </style>
  </head>
  <body class="dp-page">
    <div class="status">
      <div class="banner" id="banner" hidden><span class="icon" data-icon="thermometer"></span><span id="bannerText">机器很热，先歇一会儿或把负载降下来</span></div>

      <div class="meters" id="meters"></div>

      <div class="info-row">
        <div class="info-tile" id="thermalTile">
          <span class="stat-icon"><span class="icon" data-icon="thermometer"></span></span>
          <span class="info-meta">
            <span class="info-label">温度</span>
            <span class="info-text" id="thermalText">—</span>
          </span>
        </div>
        <div class="info-tile" id="powerTile">
          <span class="stat-icon"><span class="icon" data-icon="battery"></span></span>
          <span class="info-meta">
            <span class="info-label">电源</span>
            <span class="info-text" id="powerText">—</span>
          </span>
        </div>
        <div class="info-tile" id="netTile">
          <span class="stat-icon"><span class="icon" data-icon="wifi"></span></span>
          <span class="info-meta">
            <span class="info-label">网络</span>
            <span class="info-text" id="netText">—</span>
          </span>
        </div>
      </div>

      <footer class="dp-footer">
        <span class="grow" id="info">正在读系统状态…</span>
        <button type="button" class="gear" id="gearBtn" title="设置" aria-label="设置"><span class="icon" data-icon="settings"></span></button>
      </footer>
    </div>

    <script type="module" src="status.js"></script>
  </body>
</html>
