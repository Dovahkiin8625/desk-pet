<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>录屏</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body class="dp-page">
    <div class="studio">
      <header class="studio-bar">
        <nav class="tabs" role="tablist" aria-label="录制方式">
          <button type="button" class="tab" role="tab" data-mode="screen">全屏</button>
          <button type="button" class="tab" role="tab" data-mode="region">选取</button>
          <button type="button" class="tab" role="tab" data-mode="window">窗口</button>
        </nav>
        <!--
          刷新是**动作**，不是设置——所以它不进抽屉，
          放在顶栏上：任何 tab 下都能一键重列可录的目标。
        -->
        <button type="button" class="gear" id="refreshBtn" title="刷新可录的目标" aria-label="刷新可录的目标">
          <img src="refresh.svg" alt="" width="18" height="18" />
        </button>
        <button type="button" class="gear" id="gearBtn" title="设置" aria-label="设置">
          <img src="gear.svg" alt="" width="18" height="18" />
        </button>
      </header>

      <div class="studio-body">
        <!-- 左边：跟着 tab 换的内容 -->
        <div class="studio-left">
          <!--
            屏幕：全屏与选取都用这一块。

            预览图是**列显示器的时候一次抓齐的**（每块屏一张），
            点一下就选中——不用等主进程往返，切换是瞬时的。
            它在 pane 外面：两个 tab 共用同一块，不画两遍。
          -->
          <div class="screen-picker" id="screenPicker">
            <div class="screen-grid" id="screenGrid"></div>
            <p class="empty" id="screenEmpty" hidden>没有可录的屏幕</p>
          </div>

          <!-- 全屏：整块录 -->
          <section class="pane" data-pane="screen">
            <p class="pane-hint">整块录：选中的那块屏从头录到尾，不框选。</p>
          </section>

          <!-- 选取：框一块 -->
          <section class="pane" data-pane="region" hidden>
            <div class="region-box">
              <div class="region-icon">▣</div>
              <p class="region-text">
                在选中的那块屏上拖一个框，框住要录的地方。<br />
                框完之后边框会留在桌面上，录完才撤。
              </p>
            </div>
            <p class="region-size" id="regionSize"></p>
          </section>

          <!-- 窗口：窗口列表（图标 + 名字） -->
          <section class="pane" data-pane="window" hidden>
            <ul class="dp-list win-list" id="windowList"></ul>
            <p class="empty" id="windowEmpty" hidden>没有可录的窗口</p>
          </section>
        </div>

        <!-- 右边：三个 tab 共用的录制设置 -->
        <div class="studio-right">
          <label class="field">
            <span>麦克风</span>
            <select id="micSelect" class="dp-input"></select>
          </label>
          <label class="field">
            <span>扬声器</span>
            <select id="speakerSelect" class="dp-input">
              <!-- 选项写死在 HTML 里：这个下拉框只有两项，
                   页面脚本只负责把当前值选上。 -->
              <option value="on">录系统声音</option>
              <option value="off">不录</option>
            </select>
          </label>
          <div class="field">
            <span>格式</span>
            <div class="dp-segmented" id="formatGroup">
              <button type="button" data-format="video">视频</button>
              <button type="button" data-format="gif">GIF</button>
            </div>
          </div>
          <p class="note" id="gifNote" hidden>GIF 存不了声音——切到 GIF 时不会录声音。</p>
          <button type="button" class="dp-button primary record" id="recordBtn">开始录制</button>
          <p class="note" id="hotkeyError" hidden></p>
        </div>
      </div>

      <footer class="dp-footer studio-foot">
        <span class="grow" id="statusText"></span>
        <span class="time" id="elapsed"></span>
      </footer>

      <!-- 设置抽屉：从右边滑出来 -->
      <div class="scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" hidden aria-label="设置">
        <div class="drawer-head">
          <h2>设置</h2>
          <button type="button" class="drawer-close" id="drawerClose" title="关上">✕</button>
        </div>

        <!--
          设置按**功能**分三块：存哪儿 / 按什么键 / 录多清楚。

          早先这里是八个平铺的输入框，谁也说不清哪个管什么；
          现在每块有小标题，点开就知道自己在调哪件事。
        -->
        <div class="drawer-body">
          <!-- 一、存哪儿 -->
          <section class="set-group">
            <h3 class="dp-section-title">存放位置</h3>
            <div class="dir-row">
              <input id="outputDir" class="dp-input" type="text" placeholder="视频文件夹" />
              <button type="button" class="dp-button" id="pickDir">浏览…</button>
            </div>
            <p class="set-hint" id="outputDirHint"></p>
            <button type="button" class="dp-button" id="openDir">打开输出文件夹</button>
          </section>

          <!-- 二、按什么键 -->
          <section class="set-group">
            <h3 class="dp-section-title">快捷键</h3>
            <p class="set-hint">点「改」再按键（要带 Ctrl/Alt/Shift）。</p>
            <div class="hk-row">
              <span class="hk-name">开始录制</span>
              <kbd class="hk-key" id="hotkeyStart"></kbd>
              <button type="button" class="dp-button small" id="recordStartKey" title="改「开始录制」的快捷键">改</button>
            </div>
            <div class="hk-row">
              <span class="hk-name">停止录制</span>
              <kbd class="hk-key" id="hotkeyStop"></kbd>
              <button type="button" class="dp-button small" id="recordStopKey" title="改「停止录制」的快捷键">改</button>
            </div>
          </section>

          <!--
            三、录多清楚。

            视频与 GIF 的档位各管各的，所以分成两块摆着，
            **当前格式的那块标出来**，另一块标「当前不用」——
            别让用户以为录视频时 GIF 的数字也起作用。
          -->
          <section class="set-group">
            <h3 class="dp-section-title">录制质量</h3>
            <div class="q-block" id="qVideo">
              <div class="q-head">
                <span>视频</span>
                <span class="q-tag" id="qVideoTag">当前</span>
              </div>
              <label class="q-row">
                <span class="q-name">帧率</span>
                <input id="fps" class="dp-input" type="number" min="5" max="60" />
                <span class="q-unit">帧/秒</span>
              </label>
            </div>
            <div class="q-block" id="qGif">
              <div class="q-head">
                <span>GIF</span>
                <span class="q-tag" id="qGifTag">当前</span>
              </div>
              <label class="q-row">
                <span class="q-name">宽度</span>
                <input id="gifWidth" class="dp-input" type="number" min="160" max="1920" />
                <span class="q-unit">像素</span>
              </label>
              <label class="q-row">
                <span class="q-name">帧率</span>
                <input id="gifFps" class="dp-input" type="number" min="5" max="30" />
                <span class="q-unit">帧/秒</span>
              </label>
            </div>
          </section>
        </div>
      </aside>
    </div>

    <script type="module" src="studio.js"></script>
  </body>
</html>
