<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>录屏</title>
    <link rel="stylesheet" href="/src/renderer/ui/theme.css" />
    <link rel="stylesheet" href="studio.css" />
  </head>
  <body class="dp-page">
    <div class="studio">
      <header class="studio-bar">
        <nav class="tabs" role="tablist" aria-label="录制方式">
          <button type="button" class="tab" role="tab" data-mode="screen">全屏</button>
          <button type="button" class="tab" role="tab" data-mode="region">选取</button>
          <button type="button" class="tab" role="tab" data-mode="window">窗口</button>
        </nav>
        <button type="button" class="gear" id="gearBtn" title="设置" aria-label="设置">
          <img src="gear.svg" alt="" width="18" height="18" />
        </button>
      </header>

      <div class="studio-body">
        <!-- 左边：跟着 tab 换的内容 -->
        <div class="studio-left">
          <!-- 全屏：屏幕预览 -->
          <section class="pane" data-pane="screen">
            <div class="preview">
              <img id="screenPreview" alt="要录的屏幕" />
              <div class="preview-tip" id="previewTip">正在取预览…</div>
            </div>
            <label class="field">
              <span>屏幕</span>
              <select id="screenSelect" class="dp-input"></select>
            </label>
          </section>

          <!-- 选取：框一块 -->
          <section class="pane" data-pane="region" hidden>
            <div class="region-box">
              <div class="region-icon">▣</div>
              <p class="region-text">
                在屏幕上拖一个框，框住要录的地方。<br />
                框完之后边框会留在桌面上，录完才撤。
              </p>
            </div>
            <p class="region-size" id="regionSize"></p>
          </section>

          <!-- 窗口：窗口列表（图标 + 名字） -->
          <section class="pane" data-pane="window" hidden>
            <ul class="dp-list win-list" id="windowList"></ul>
            <p class="empty" id="windowEmpty" hidden>没有可录的窗口</p>
          </section>
        </div>

        <!-- 右边：三个 tab 共用的录制设置 -->
        <div class="studio-right">
          <label class="field">
            <span>麦克风</span>
            <select id="micSelect" class="dp-input"></select>
          </label>
          <label class="field">
            <span>扬声器</span>
            <select id="speakerSelect" class="dp-input">
              <!-- 选项写死在 HTML 里：这个下拉框只有两项，
                   页面脚本只负责把当前值选上。 -->
              <option value="on">录系统声音</option>
              <option value="off">不录</option>
            </select>
          </label>
          <div class="field">
            <span>格式</span>
            <div class="dp-segmented" id="formatGroup">
              <button type="button" data-format="video">视频</button>
              <button type="button" data-format="gif">GIF</button>
            </div>
          </div>
          <p class="note" id="gifNote" hidden>GIF 存不了声音——切到 GIF 时不会录声音。</p>
          <button type="button" class="dp-button primary record" id="recordBtn">开始录制</button>
          <p class="note" id="hotkeyError" hidden></p>
        </div>
      </div>

      <footer class="dp-footer studio-foot">
        <span class="grow" id="statusText"></span>
        <span class="time" id="elapsed"></span>
      </footer>

      <!-- 设置抽屉：从右边滑出来 -->
      <div class="scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" hidden aria-label="设置">
        <div class="drawer-head">
          <h2>设置</h2>
          <button type="button" class="drawer-close" id="drawerClose" title="关上">✕</button>
        </div>

        <div class="drawer-body">
          <div class="field">
            <span>存放位置</span>
            <div class="row">
              <input id="outputDir" class="dp-input" type="text" placeholder="留空＝视频文件夹" />
              <button type="button" class="dp-button" id="pickDir">浏览…</button>
            </div>
          </div>

          <div class="field">
            <span>开始录制</span>
            <div class="row">
              <input id="hotkeyStart" class="dp-input" type="text" readonly placeholder="点右边录制" />
              <button type="button" class="dp-button" id="recordStartKey">录制</button>
            </div>
          </div>

          <div class="field">
            <span>停止录制</span>
            <div class="row">
              <input id="hotkeyStop" class="dp-input" type="text" readonly placeholder="点右边录制" />
              <button type="button" class="dp-button" id="recordStopKey">录制</button>
            </div>
          </div>

          <div class="field">
            <span>视频帧率</span>
            <input id="fps" class="dp-input" type="number" min="5" max="60" />
          </div>

          <div class="field">
            <span>GIF 宽度</span>
            <input id="gifWidth" class="dp-input" type="number" min="160" max="1920" />
          </div>

          <div class="field">
            <span>GIF 帧率</span>
            <input id="gifFps" class="dp-input" type="number" min="5" max="30" />
          </div>

          <button type="button" class="dp-button" id="openDir">打开输出文件夹</button>
          <button type="button" class="dp-button" id="refreshTargets">刷新可录的目标</button>
        </div>
      </aside>
    </div>

    <script type="module" src="studio.js"></script>
  </body>
</html>
