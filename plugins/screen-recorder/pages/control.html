<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>录制中</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 100%;
        padding: 0 14px;
        border-radius: 14px;
        background: rgba(28, 28, 32, 0.88);
        color: #fff;
        font: 14px/1.2 "Microsoft YaHei", sans-serif;
        /* 整条都能拖：录屏的时候用户常常想把它挪开。 */
        -webkit-app-region: drag;
      }
      #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff4d4f;
        flex: none;
      }
      #time {
        font-variant-numeric: tabular-nums;
        flex: 1;
      }
      button {
        -webkit-app-region: no-drag;
        font: 14px/1.2 "Microsoft YaHei", sans-serif;
        padding: 6px 14px;
        border: 0;
        border-radius: 8px;
        background: #ff4d4f;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="dot"></span>
      <span id="time">00:00</span>
      <button id="stop" type="button">停止</button>
    </div>
    <script src="control.js"></script>
  </body>
</html>
