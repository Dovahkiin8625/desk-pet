<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>录屏设置</title>
    <style>
      body {
        margin: 0;
        padding: 18px 20px;
        font: 14px/1.6 "Microsoft YaHei", sans-serif;
        color: #222;
        background: #fffdf8;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .row label {
        width: 96px;
        flex: none;
        color: #555;
      }
      input[type='text'] {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: #4f9dff;
        border-color: #4f9dff;
        color: #fff;
      }
      #status {
        margin-top: 14px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #f3f3f3;
        color: #555;
        min-height: 20px;
      }
      #hotkeyError {
        color: #c0392b;
        margin-top: 8px;
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin: -4px 0 14px;
      }
    </style>
  </head>
  <body>
    <h1>录屏设置</h1>

    <div class="row">
      <label for="outputDir">存放位置</label>
      <input id="outputDir" type="text" placeholder="留空＝视频文件夹" />
      <button id="pickDir" type="button">浏览…</button>
    </div>

    <div class="row">
      <label for="hotkey">快捷键</label>
      <input id="hotkey" type="text" readonly placeholder="点右边录制" />
      <button id="recordHotkey" type="button">录制</button>
    </div>
    <p class="hint">快捷键只在这个窗口开着的时候生效——关掉窗口就把这个组合键让回给别的程序。</p>

    <div class="row">
      <label for="fps">视频帧率</label>
      <input id="fps" type="text" />
    </div>

    <div class="row">
      <label for="gifWidth">GIF 宽度</label>
      <input id="gifWidth" type="text" />
    </div>

    <div class="row">
      <button id="openDir" type="button">打开输出文件夹</button>
    </div>

    <div id="status"></div>
    <div id="hotkeyError"></div>

    <script src="workbench.js"></script>
  </body>
</html>
